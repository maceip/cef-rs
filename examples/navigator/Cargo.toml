[package]
name = "navigator"
description = "CEF off-screen rendering host aimed at automated web agents; targets CLI parity with vercel-labs/agent-browser."
edition = "2021"
publish = false

[features]
default = ["accelerated_osr"]
accelerated_osr = ["cef/accelerated_osr"]

[package.metadata.cef.bundle]
helper_name = "navigator_helper"

[dependencies]
cef.workspace = true
wgpu.workspace = true

env_logger = "0.11"
pollster = "0.4"
tokio = { version = "1", features = ["full"] }
winit = { version = "0.30" }
bytemuck = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
libloading.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
metal.workspace = true
objc.workspace = true
io-surface.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
